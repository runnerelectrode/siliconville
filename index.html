<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Become a Silicon Valley AI Simulation Citizen."
    />
    <title>Siliconville</title>

    <!-- Social cards.
         Absolute URLs, because scrapers do not resolve relative paths — a
         relative og:image is the usual reason a link unfurls with no picture.
         1200x628 is the large-card ratio; the README banner is 2:1 and would
         letterbox here, so this is its own crop of the same render. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siliconville" />
    <meta property="og:title" content="Siliconville" />
    <meta
      property="og:description"
      content="Become a Silicon Valley AI Simulation Citizen."
    />
    <meta property="og:url" content="https://siliconville.town" />
    <meta property="og:image" content="https://siliconville.town/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Siliconville" />
    <meta
      name="twitter:description"
      content="Become a Silicon Valley AI Simulation Citizen."
    />
    <meta name="twitter:image" content="https://siliconville.town/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
